    <script>
      // When hosted on GitHub Pages from repository root, seamlessly load static bundle
      if (
        window.location.hostname.endsWith("github.io") &&
        !window.location.pathname.includes("/dist/") &&
        !window.location.pathname.includes("/docs/")
      ) {
        var base = window.location.pathname.endsWith("/")
          ? window.location.pathname
          : window.location.pathname + "/";
        window.location.replace(
          base + "dist/" + window.location.search + window.location.hash
        );
      }
    </script>
